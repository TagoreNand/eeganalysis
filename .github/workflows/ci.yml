name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch + dl/feature/export/dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          pip install -e ".[dl,features,export,dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy src || true   # advisory while typing is incrementally added
      - name: Unit tests (fast)
        run: pytest -m "not slow and not gpu" --cov=eegpipe --cov-report=xml
      - name: Export module import smoke
        run: python -c "import eegpipe.serving.export, eegpipe.inference.onnx_predictor; print('export OK')"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  regression-gate:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # In a real pipeline, download the latest run's reports/sleep_metrics.json (DVC/artifact)
      # and compare to the committed baseline. Here we smoke-test the gate against the baseline.
      - name: Model-regression gate
        run: |
          python scripts/check_regression.py \
            --baseline tests/baseline_metrics.json \
            --current tests/baseline_metrics.json \
            --metric test/macro_f1 --tol 0.02

  docker-build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t eegpipe:ci .
