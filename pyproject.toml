[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eegpipe"
version = "0.1.0"
description = "A modular, production-ready EEG/BCI machine-learning pipeline built on MNE-Python, Braindecode and PyTorch Lightning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tagore Nand" }]
keywords = ["eeg", "bci", "mne", "deep-learning", "neuroinformatics"]

# Core runtime dependencies. Heavy/optional stacks live in [project.optional-dependencies].
dependencies = [
    "mne>=1.6",
    "mne-bids>=0.14",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "rich>=13.0",
]

[project.optional-dependencies]
# Deep learning stack
dl = [
    "torch>=2.1",
    "lightning>=2.2",
    "braindecode>=0.8",
    "einops>=0.7",
]
# Classical / Riemannian feature engineering
features = [
    "pyriemann>=0.5",
    "PyWavelets>=1.4",
    "autoreject>=0.4",
    "mne-icalabel>=0.5",
]
# Experiment tracking & data versioning
mlops = [
    "mlflow>=2.10",
    "wandb>=0.16",
    "dvc[s3]>=3.0",
    "optuna>=3.5",
]
# Real-time streaming + serving + dashboard
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pylsl>=1.16",
    "streamlit>=1.31",
    "plotly>=5.18",
]
# Model export & ONNX-runtime serving
export = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]
# Developer tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff==0.6.9",
    "mypy>=1.8",
    "pre-commit>=3.6",
]
# Convenience meta-extra
all = ["eegpipe[dl,features,mlops,serve,export,dev]"]

[project.scripts]
eegpipe-train = "eegpipe.training.train:main"
eegpipe-eval = "eegpipe.training.evaluate:main"
eegpipe-serve = "eegpipe.serving.api:run"
eegpipe-sleep = "eegpipe.training.sleep:main"
eegpipe-pretrain = "eegpipe.training.pretrain:main"
eegpipe-export = "eegpipe.serving.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["NPY002"]  # test fixtures may use legacy np.random

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=eegpipe --cov-report=term-missing"
markers = [
    "slow: marks tests that download data or train models (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require a CUDA device",
]
