# SleepTransformer with a pretrained EEG foundation model as the epoch encoder.
# `foundation: mock` runs anywhere; switch to bendr/labram once weights are wired
# (see models/foundation.py::build_foundation_encoder).
name: sleep_transformer
encoder: foundation
foundation: mock
freeze_encoder: true       # linear-probe; set false to fine-tune the whole encoder
emb_dim: 128
depth: 4
n_heads: 8
mlp_ratio: 4
dropout: 0.3
sfreq: 100
lr: 5.0e-4
weight_decay: 1.0e-3
max_epochs: 150
use_focal: false
focal_gamma: 2.0
